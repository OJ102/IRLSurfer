<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1524"/>
      <stop offset="60%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#38bdf8" stroke-width="1"/>
    <line x1="400" y1="0" x2="1200" y2="530" stroke="#38bdf8" stroke-width="1"/>
    <line x1="800" y1="0" x2="1200" y2="260" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="630" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <!-- Wave decoration -->
  <path d="M0 480 Q150 440 300 470 T600 450 T900 475 T1200 455 L1200 630 L0 630 Z" fill="#0284c7" opacity="0.3"/>
  <path d="M0 520 Q200 490 400 520 T800 500 T1200 520 L1200 630 L0 630 Z" fill="#38bdf8" opacity="0.15"/>
  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="900" fill="url(#gold)" letter-spacing="4">IRL SURFER</text>
  <text x="600" y="200" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="900" fill="none" stroke="#78350f" stroke-width="2" letter-spacing="4" opacity="0.5">IRL SURFER</text>
  <!-- Subtitle -->
  <text x="600" y="265" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#38bdf8" letter-spacing="6">REAL-TIME WEBCAM BODY CONTROLLER</text>
  <!-- Stats bar -->
  <g transform="translate(600,350)">
    <!-- Stat 1 -->
    <g transform="translate(-340,0)">
      <text x="0" y="0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="900" fill="#fde047">1,200+</text>
      <text x="0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="2">FPS THROUGHPUT</text>
    </g>
    <!-- Stat 2 -->
    <g transform="translate(-10,0)">
      <text x="0" y="0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="900" fill="#34d399">F1 = 1.00</text>
      <text x="0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="2">MACRO F1 SCORE</text>
    </g>
    <!-- Stat 3 -->
    <g transform="translate(320,0)">
      <text x="0" y="0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="900" fill="#fb7185">0.00</text>
      <text x="0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="2">FALSE TRIGGERS/MIN</text>
    </g>
  </g>
  <!-- Tech badges -->
  <g transform="translate(600,440)">
    <rect x="-280" y="-16" width="110" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="-225" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#38bdf8">MediaPipe</text>
    <rect x="-150" y="-16" width="100" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="-100" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#3178c6">TypeScript</text>
    <rect x="-30" y="-16" width="100" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fde047">Python 3.12</text>
    <rect x="90" y="-16" width="86" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="133" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f97316">WebASM</text>
    <rect x="196" y="-16" width="86" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="239" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#a78bfa">OpenCV</text>
  </g>
  <!-- Footer -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#64748b">github.com/OJ102/IRLSurfer</text>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#475569">Zero-install live demo · Dual Python + Web runtimes · 100% on-device inference</text>
</svg>
