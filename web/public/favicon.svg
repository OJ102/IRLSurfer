<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Wave -->
  <path d="M0 340 Q80 290 160 320 T320 300 T480 330 L512 330 L512 512 L0 512 Z" fill="url(#wave)" opacity="0.25"/>
  <path d="M0 370 Q100 330 200 360 T400 340 L512 360 L512 512 L0 512 Z" fill="url(#wave)" opacity="0.15"/>
  <!-- Surfboard -->
  <g transform="translate(256,260) rotate(-18)">
    <ellipse cx="0" cy="0" rx="28" ry="120" fill="url(#board)" stroke="#92400e" stroke-width="3"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#78350f" stroke-width="2" opacity="0.4"/>
    <line x1="-10" y1="-60" x2="-10" y2="60" stroke="#0d9488" stroke-width="4" opacity="0.6"/>
    <line x1="10" y1="-60" x2="10" y2="60" stroke="#fb7185" stroke-width="4" opacity="0.6"/>
  </g>
  <!-- Person silhouette (simplified surfer) -->
  <g transform="translate(256,180)">
    <circle cx="0" cy="-40" r="22" fill="#ffffff"/>
    <path d="M0 -18 L-28 40 L-12 40 L0 10 L12 40 L28 40 Z" fill="#ffffff"/>
    <line x1="-35" y1="0" x2="35" y2="-10" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
