[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irlsurfer"
version = "0.1.0"
description = "Computer vision gesture controller for Subway Surfers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "IRLSurfer Team" }
]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10.0.84",
    "pynput>=1.7.7",
    "numpy>=1.26.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
irlsurfer = "irlsurfer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["irlsurfer*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "mediapipe.*",
    "pynput.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
